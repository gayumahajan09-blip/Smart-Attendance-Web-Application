<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Smart Attendance</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f6f8fa; margin:0; font-family: 'Segoe UI', Arial, sans-serif; }
    .header-bar{ background:#34495e;color:#fff;text-align:center;padding:20px 0;font-weight:700 }
    .card{ background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(52,73,94,0.10);max-width:480px;margin:40px auto;padding:28px }
    .card-title{ font-size:1.3rem;color:#34495e;font-weight:700;margin-bottom:18px;text-align:center }
    .tab-container{ display:flex;width:100%;background:#f1f5f8;border-radius:10px;overflow:hidden;margin-bottom:18px }
    .tab{ flex:1;padding:10px;text-align:center;cursor:pointer;color:#64748b;font-weight:600 }
    .tab.active{ background:#fff;color:#0b7285;box-shadow:0 2px 8px rgba(52,73,94,0.06) }
    .form-group{ margin-bottom:12px }
    .form-label{ display:block;margin-bottom:6px;color:#34495e;font-weight:600 }
    .form-input{ width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e6eef2;background:#f8fafb }
    .btn{ width:100%;padding:12px;border-radius:8px;border:none;background:#1687a0;color:#fff;font-weight:700;cursor:pointer }
    .small-link{ display:block;text-align:center;margin-top:12px;color:#1687a0 }
    .msg{ text-align:center;font-weight:700;margin-top:10px }
    .msg.error{ color:#b91c1c }
    .msg.success{ color:#15803d }
  </style>
</head>
<body>
  <div class="header-bar">Smart Attendance - Reset Password</div>
  <div class="card">
    <div class="card-title">Forgot password</div>

    <div class="tab-container" role="tablist">
      <div class="tab active" data-role="teacher" id="fp-tab-teacher">Teacher</div>
      <div class="tab" data-role="student" id="fp-tab-student">Student</div>
    </div>

    <form id="fpForm" onsubmit="event.preventDefault();handleReset();">
      <div class="form-group">
        <label class="form-label" for="fp_username">Username or Email</label>
        <input id="fp_username" class="form-input" type="text" placeholder="Enter your username or email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="fp_password">New Password</label>
        <input id="fp_password" class="form-input" type="password" placeholder="Enter new password" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="fp_confirm">Confirm New Password</label>
        <input id="fp_confirm" class="form-input" type="password" placeholder="Repeat new password" required>
      </div>

      <button class="btn" type="submit">Set new password</button>
      <div id="fpMsg" class="msg" style="display:none"></div>
    </form>

    <a class="small-link" href="landing.html">Back to login</a>
  </div>

  <script>
    (function(){
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(t => t.addEventListener('click', ()=>{ tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active'); }));

      function normalize(u){ return (u||'').trim().toLowerCase(); }

      window.handleReset = function(){
        const role = document.querySelector('.tab.active').dataset.role || 'teacher';
        const username = document.getElementById('fp_username').value.trim();
        const password = document.getElementById('fp_password').value;
        const confirm = document.getElementById('fp_confirm').value;
        const msg = document.getElementById('fpMsg');
        msg.style.display = 'none';

        if(!username || !password || !confirm){ msg.textContent='Please fill all fields.'; msg.className='msg error'; msg.style.display='block'; return; }
        if(password !== confirm){ msg.textContent='Passwords do not match.'; msg.className='msg error'; msg.style.display='block'; return; }

        const key = 'sam_users';
        const users = JSON.parse(localStorage.getItem(key) || '[]');
        const idx = users.findIndex(u => normalize(u.username) === normalize(username) && u.role === role);
        if(idx === -1){ msg.textContent='No account found for that username and role.'; msg.className='msg error'; msg.style.display='block'; return; }

        // Update password
        users[idx].password = password;
        users[idx].updated = Date.now();
        localStorage.setItem(key, JSON.stringify(users));

        msg.textContent = 'Password updated successfully. Redirecting to login...'; msg.className='msg success'; msg.style.display='block';
        setTimeout(()=>{ window.location.href = 'landing.html'; }, 1400);
      };
    })();
  </script>
  
</body>
</html>
